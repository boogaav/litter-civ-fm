<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE LITTER — kitten</title>
<link rel="stylesheet" href="theme.css">
<style>
  .wrap { max-width: 640px; }
  .portrait { width: 100%; aspect-ratio: 4/3; border-radius: 12px; border: 1px solid var(--edge); background: var(--accent-soft); display: grid; place-items: center; overflow: hidden; color: var(--accent); font: 600 64px var(--serif); }
  .portrait img { width: 100%; height: 100%; object-fit: cover; }
  .tag { color: var(--dim); font-family: var(--serif); font-size: 17px; margin-top: 4px; }
  .note { color: var(--dim); font-size: 13px; margin-top: 12px; }
  .backers { text-align: center; color: var(--ok); font-size: 13px; margin-top: 8px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; }
  .topbar a { text-decoration: none; color: var(--dim); font-size: 13px; }
  h1 { margin-top: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><a href="/">&larr; The Litter Experiment</a><span id="walletBox"></span></div>
  <h1><span id="num">Kitten</span></h1>
  <div class="tag" id="name"></div>

  <div class="panel">
    <div class="portrait" id="portrait"><span class="ph" id="ph"></span></div>
    <div class="row"><span>born</span><b>Aug 31, 2026</b></div>
    <div class="row"><span>age</span><b id="age">Day ?</b></div>
    <div class="row"><span>token</span><b id="status"></b></div>
    <div class="row"><span>portrait</span><b id="pstatus">pending</b></div>
    <div class="note">Back a kitten to join its faction; backers rank the subjects on the home page.</div>
    <button class="pledge" id="pledge">Back this kitten</button>
    <div class="backers" id="backers"></div>
  </div>

  <div class="panel" style="margin-top:16px;">
    <h2 id="tHead">Token</h2>
    <div class="row"><span>ticker</span><b id="tTicker"></b></div>
    <div class="row"><span>paired with</span><b id="tPair"></b></div>
    <div class="row"><span>launch</span><b id="tLaunch"></b></div>
    <div id="tMarket"></div>
    <div id="tAction"></div>
    <div class="note" id="tNote"></div>
  </div>
</div>

<script src="wallet.js"></script>
<script src="kittens.js"></script>
<script>
const n = Math.min(6, Math.max(1, Number(new URLSearchParams(location.search).get("n")) || 1));
const K = KITTENS.find((k) => k.n === n);
document.getElementById("num").textContent = K.name + " " + K.sex;
document.getElementById("ph").textContent = K.name[0];
document.title = "The Litter Experiment — " + K.name + " ($" + K.ticker + ")";
document.getElementById("name").textContent = K.bio;
document.getElementById("age").textContent = "Day " + (Math.floor((Date.now() - new Date("2026-08-31")) / 864e5) + 1);
document.getElementById("status").textContent = "$" + K.ticker + " · paired with " + K.pair + " (" + K.pairName + ")";
const API = "https://litter-api.boogaav.workers.dev";
// --- Token trading panel ---
{
  const st = kittenStatus(K);
  const d = new Date(K.launch + "T18:00:00Z");
  document.getElementById("tHead").textContent = "$" + K.ticker + " · " + (st === "live" ? "trading" : st === "tonight" ? "launching tonight" : "upcoming");
  document.getElementById("tTicker").textContent = "$" + K.ticker;
  document.getElementById("tPair").textContent = K.pair + " · " + K.pairName;
  document.getElementById("tLaunch").textContent = kittenLaunchLabel(K);
  const act = document.getElementById("tAction"), note = document.getElementById("tNote");
  if (K.ca) {
    const short = K.ca.slice(0, 8) + "…" + K.ca.slice(-6);
    act.innerHTML = `<div class="row"><span>contract</span><b id="tCa" style="cursor:pointer" title="copy">${short} · copy</b></div>
      <a class="pledge" target="_blank" rel="noopener" href="https://www.ponsfamily.com/launchpad/${K.ca}">Trade $${K.ticker}</a>`;
    document.getElementById("tCa").onclick = () => { navigator.clipboard.writeText(K.ca); document.getElementById("tCa").textContent = "copied"; setTimeout(() => document.getElementById("tCa").textContent = short + " · copy", 1500); };
    note.textContent = "Only this contract address is real. Bonding curve on pons (Robinhood Chain); graduates to Uniswap at 4.2 ETH. Trading fees buy the litter's food. Memecoin, not an investment — it can go to zero.";
    const fmt = (v) => v >= 1e6 ? "$" + (v/1e6).toFixed(2) + "M" : v >= 1e3 ? "$" + (v/1e3).toFixed(1) + "k" : "$" + v.toFixed(v < 0.01 ? 7 : 2);
    fetch(API + "/api/market?token=" + K.ca).then((r) => r.json()).then((m) => {
      if (m.error) return;
      document.getElementById("tMarket").innerHTML =
        `<div class="row"><span>price</span><b>${fmt(m.priceUsd)}</b></div>
         <div class="row"><span>market cap</span><b>${fmt(m.mcapUsd)}</b></div>
         <div class="row"><span>holders</span><b>${m.holders}</b></div>
         <div class="row"><span>food funded</span><b>${m.cans} cans</b></div>`;
    }).catch(() => {});
  } else {
    act.innerHTML = `<button class="pledge" disabled>${st === "tonight" ? "Launches tonight" : "Launches " + d.toLocaleDateString([], { weekday: "long", month: "short", day: "numeric" })}</button>`;
    note.textContent = "One kitten token launches every Tuesday evening on pons (Robinhood Chain), paired with a tokenized stock. The contract address appears here the moment $" + K.ticker + " is live — anything claiming to be $" + K.ticker + " before that is a fake.";
  }
}

const btn = document.getElementById("pledge");
const backersEl = document.getElementById("backers");

function renderCounts(pledges) {
  const mine = pledges.find((p) => p.kitten === n);
  backersEl.textContent = mine ? `${mine.count} backers` : "be the first backer";
}
fetch(API + "/api/pledges").then((r) => r.json()).then(renderCounts).catch(() => {});

function syncButton() {
  const s = walletSession();
  if (s) {
    btn.disabled = false;
    btn.textContent = "Back " + K.name + " as " + shortAddr(s.address);
    fetch(API + "/api/me", { headers: { authorization: "Bearer " + s.token } })
      .then((r) => r.json())
      .then((me) => { if (me.kitten === n) btn.textContent = "You back " + K.name; })
      .catch(() => {});
  } else {
    let pledged = false;
    try { pledged = localStorage.getItem("pledged-" + n) === "1"; } catch {}
    btn.disabled = pledged;
    btn.textContent = pledged ? "You back " + K.name : "Back this kitten";
  }
}
mountWalletButton(syncButton);
syncButton();

btn.onclick = async () => {
  btn.disabled = true;
  const s = walletSession();
  try {
    const headers = { "content-type": "application/json" };
    if (s) headers.authorization = "Bearer " + s.token;
    const pledges = await (await fetch(API + "/pledge", {
      method: "POST", headers, body: JSON.stringify({ kitten: n }),
    })).json();
    renderCounts(pledges);
    if (s) {
      btn.textContent = "You back " + K.name;
      btn.disabled = false;
    } else {
      btn.textContent = "You back " + K.name;
      try { localStorage.setItem("pledged-" + n, "1"); } catch {}
    }
  } catch {
    btn.disabled = false;
  }
};

const img = new Image();
img.onload = () => {
  const p = document.getElementById("portrait");
  p.innerHTML = "";
  p.appendChild(img);
  document.getElementById("pstatus").textContent = "studio session · Sep 2026";
};
img.src = "k/" + n + ".jpg";
</script>
</body>
</html>
