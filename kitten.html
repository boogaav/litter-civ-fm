<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE LITTER — kitten</title>
<link rel="stylesheet" href="theme.css">
<style>
  .wrap { max-width: 640px; }
  .portrait { width: 100%; aspect-ratio: 4/3; border-radius: 12px; border: 1px solid var(--edge); background: var(--accent-soft); display: grid; place-items: center; overflow: hidden; color: var(--accent); font: 600 64px var(--serif); }
  .portrait img { width: 100%; height: 100%; object-fit: cover; }
  .tag { color: var(--dim); font-family: var(--serif); font-size: 17px; margin-top: 4px; }
  .note { color: var(--dim); font-size: 13px; margin-top: 12px; }
  .backers { text-align: center; color: var(--ok); font-size: 13px; margin-top: 8px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; }
  .topbar a { text-decoration: none; color: var(--dim); font-size: 13px; }
  h1 { margin-top: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><a href="/">&larr; The Litter Experiment</a><span id="walletBox"></span></div>
  <h1><span id="num">Kitten</span></h1>
  <div class="tag" id="name"></div>

  <div class="panel">
    <div class="portrait" id="portrait"><span class="ph" id="ph"></span></div>
    <div class="row"><span>born</span><b>Aug 31, 2026</b></div>
    <div class="row"><span>age</span><b id="age">Day ?</b></div>
    <div class="row"><span>token</span><b id="status"></b></div>
    <div class="row"><span>portrait</span><b id="pstatus">pending — still part of the pile</b></div>
    <div class="note">Portraits are captured by the AI observer once a kitten separates from the pile. Back a kitten to join its faction; backers rank the subjects on the home page.</div>
    <button class="pledge" id="pledge">Back this kitten</button>
    <div class="backers" id="backers"></div>
  </div>
</div>

<script src="wallet.js"></script>
<script src="kittens.js"></script>
<script>
const n = Math.min(6, Math.max(1, Number(new URLSearchParams(location.search).get("n")) || 1));
const K = KITTENS.find((k) => k.n === n);
document.getElementById("num").textContent = K.name + " " + K.sex;
document.getElementById("ph").textContent = K.name[0];
document.title = "The Litter Experiment — " + K.name + " ($" + K.ticker + ")";
document.getElementById("name").textContent = K.bio;
document.getElementById("age").textContent = "Day " + (Math.floor((Date.now() - new Date("2026-08-31")) / 864e5) + 1);
document.getElementById("status").textContent = "$" + K.ticker + " · paired with " + K.pair + " (" + K.pairName + ")";
const launchRow = document.createElement("div");
launchRow.className = "row";
launchRow.innerHTML = `<span>token</span><b>${kittenLaunchLabel(K)}</b>`;
document.getElementById("pstatus").parentElement.after(launchRow);
if (K.ca) {
  const caRow = document.createElement("div");
  caRow.className = "row";
  caRow.innerHTML = `<span>CA</span><b style="cursor:pointer" title="copy">${K.ca.slice(0, 8)}…${K.ca.slice(-6)} 📋</b>`;
  caRow.querySelector("b").onclick = () => navigator.clipboard.writeText(K.ca);
  launchRow.after(caRow);
  const trade = document.createElement("a");
  trade.className = "pledge"; trade.style.cssText = "display:block;text-align:center;text-decoration:none;margin-top:10px";
  trade.target = "_blank"; trade.rel = "noopener";
  trade.href = "https://www.ponsfamily.com/launchpad/" + K.ca; trade.textContent = "Trade $" + K.ticker;
  caRow.after(trade);
}
const API = "https://litter-api.boogaav.workers.dev";
const btn = document.getElementById("pledge");
const backersEl = document.getElementById("backers");

function renderCounts(pledges) {
  const mine = pledges.find((p) => p.kitten === n);
  backersEl.textContent = mine ? `${mine.count} backers` : "be the first backer";
}
fetch(API + "/api/pledges").then((r) => r.json()).then(renderCounts).catch(() => {});

function syncButton() {
  const s = walletSession();
  if (s) {
    btn.disabled = false;
    btn.textContent = "Back " + K.name + " as " + shortAddr(s.address);
    fetch(API + "/api/me", { headers: { authorization: "Bearer " + s.token } })
      .then((r) => r.json())
      .then((me) => { if (me.kitten === n) btn.textContent = "You back " + K.name; })
      .catch(() => {});
  } else {
    let pledged = false;
    try { pledged = localStorage.getItem("pledged-" + n) === "1"; } catch {}
    btn.disabled = pledged;
    btn.textContent = pledged ? "You back " + K.name : "Back this kitten";
  }
}
mountWalletButton(syncButton);
syncButton();

btn.onclick = async () => {
  btn.disabled = true;
  const s = walletSession();
  try {
    const headers = { "content-type": "application/json" };
    if (s) headers.authorization = "Bearer " + s.token;
    const pledges = await (await fetch(API + "/pledge", {
      method: "POST", headers, body: JSON.stringify({ kitten: n }),
    })).json();
    renderCounts(pledges);
    if (s) {
      btn.textContent = "You back " + K.name;
      btn.disabled = false;
    } else {
      btn.textContent = "You back " + K.name;
      try { localStorage.setItem("pledged-" + n, "1"); } catch {}
    }
  } catch {
    btn.disabled = false;
  }
};

const img = new Image();
img.onload = () => {
  const p = document.getElementById("portrait");
  p.innerHTML = "";
  p.appendChild(img);
  document.getElementById("pstatus").textContent = "captured by the Watcher";
};
img.src = "k/" + n + ".jpg";
</script>
</body>
</html>
